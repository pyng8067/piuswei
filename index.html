<script>
(function() {
  const root = document.getElementById('language-root');
  const buttons = { zh: document.getElementById('btn-zh'), en: document.getElementById('btn-en') };

  function initializeLanguagePage() {
    const nav = document.getElementById('nav-menu');
    const main = document.getElementById('main-content');
    if (!nav || !main) return;
    const toggle = root.querySelector('.nav-toggle');
    if (toggle) toggle.onclick = function() {
      const collapsed = nav.classList.toggle('collapsed-nav');
      main.style.marginLeft = collapsed ? '0' : '16rem';
      toggle.classList.toggle('is-collapsed', collapsed);
    };
    const navLinks = nav.querySelectorAll('.nav-link');
    const sections = root.querySelectorAll('section, footer');
    function updateActive() {
      let current = '';
      sections.forEach(section => {
        if (window.pageYOffset >= section.offsetTop - 100) current = section.getAttribute('id');
      });
      navLinks.forEach(link => {
        link.classList.remove('nav-active');
        if (current && link.getAttribute('href').includes(current)) link.classList.add('nav-active');
      });
    }
    window.removeEventListener('scroll', window.__resumeScrollHandler || (() => {}));
    window.__resumeScrollHandler = updateActive;
    window.addEventListener('scroll', updateActive, { passive: true });
    updateActive();
  }

  window.switchLanguage = function(lang) {
    const template = document.getElementById('template-' + lang);
    if (!template) return;
    root.innerHTML = template.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
    document.title = lang === 'zh' ? '魏守平｜工程經理履歷' : 'Wei Shou Ping | Engineering Manager Portfolio';
    Object.keys(buttons).forEach(key => buttons[key].classList.toggle('active', key === lang));
    window.scrollTo({ top: 0, behavior: 'instant' });
    initializeLanguagePage();
  };

  // Default language: Traditional Chinese.
  window.switchLanguage('zh');
})();
</script>
